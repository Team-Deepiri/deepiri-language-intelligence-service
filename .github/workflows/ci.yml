name: Deepiri CI - deepiri-language-intelligence-service

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push-gate:
    name: Push throttle (every 5th push)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      run-ci: ${{ steps.gate.outputs.run-ci }}
    steps:
      - name: Gate CI to every 5th push on main/dev
        id: gate
        env:
          GH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            echo "Event ${GITHUB_EVENT_NAME}: running CI."
            exit 0
          fi
          counter_var="LIS_CI_PUSH_COUNTER_${GITHUB_REF_NAME^^}"
          prev=0
          if gh variable get "$counter_var" >/dev/null 2>&1; then
            prev="$(gh variable get "$counter_var")"
          fi
          next=$((prev + 1))
          if ! gh variable set "$counter_var" --value "$next" >/dev/null 2>&1; then
            echo "::warning::Could not increment repo variable ${counter_var}. CI will run on every push. Grant the workflow token 'Actions: write' or add a CI_PUSH_TOKEN secret."
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $((next % 5)) -eq 0 ]]; then
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            echo "${counter_var}=${next} (multiple of 5): running CI."
          else
            echo "run-ci=false" >> "$GITHUB_OUTPUT"
            echo "${counter_var}=${next}: skipping CI ($((5 - next % 5)) push(es) to next run)."
          fi

  ci:
    needs: push-gate
    if: needs.push-gate.outputs.run-ci == 'true'
    timeout-minutes: 20
    name: Test, Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout service into monorepo layout
        uses: actions/checkout@v4
        with:
          path: platform-services/backend/deepiri-language-intelligence-service

      - name: Checkout shared-utils
        uses: actions/checkout@v4
        with:
          repository: Team-Deepiri/deepiri-shared-utils
          path: platform-services/shared/deepiri-shared-utils
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build shared-utils
        working-directory: platform-services/shared/deepiri-shared-utils
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install service dependencies
        working-directory: platform-services/backend/deepiri-language-intelligence-service
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          npm install --legacy-peer-deps file:../../shared/deepiri-shared-utils
          npm ci --legacy-peer-deps

      - name: Type check
        working-directory: platform-services/backend/deepiri-language-intelligence-service
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: platform-services/backend/deepiri-language-intelligence-service
        run: npm test -- --passWithNoTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: platform-services
          file: platform-services/backend/deepiri-language-intelligence-service/Dockerfile
          push: false
          load: true
          tags: deepiri-language-intelligence-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container runs
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_CORE_PASSWORD: ${{ secrets.POSTGRES_CORE_PASSWORD }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
        run: |
          docker run -d --name test-container \
            -e REDIS_PASSWORD="${REDIS_PASSWORD:-password}" \
            -e INTERNAL_SERVICE_SECRET="${INTERNAL_SERVICE_SECRET:-ci-dev-only-placeholder}" \
            -e DATABASE_URL="postgresql://deepiri:${POSTGRES_CORE_PASSWORD:-deepiripassword}@localhost:5432/deepiri" \
            deepiri-language-intelligence-service:ci
          sleep 8
          docker ps -a
          docker logs test-container
          docker inspect -f '{{.State.Running}}' test-container | grep -q true || \
            echo "::warning::Container not running — check logs above (DB/streaming connection failures are expected in CI)"
          docker stop test-container || true
